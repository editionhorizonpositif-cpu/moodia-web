name: moodia
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core Flutter packages - DOIT être présent
  flutter_localizations:
    sdk: flutter
  
  # UI et Animation
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  lottie: ^3.3.2
  syncfusion_flutter_charts: ^30.2.7
  syncfusion_flutter_gauges: ^30.2.6+1  # Gardez votre version
  fl_chart: ^0.70.1
  share_plus: ^7.2.1
  flutter_animate: ^4.1.1+1
  confetti: ^0.7.0
  vibration: ^1.8.1
  vector_math: ^2.1.4
  iconsax: ^0.0.8
  animations: ^2.1.1
  flutter_staggered_grid_view: ^0.7.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_chip_tags: ^2.0.2
  flutter_rating_bar: ^4.0.0
  pull_to_refresh: ^2.0.0
  animated_text_kit: ^4.2.2
  flutter_spinkit: ^5.2.2
  flutter_colorpicker: ^1.0.0
  json_annotation: ^4.9.0
  image_picker: ^1.0.4
  file_picker: ^5.5.0
  go_router: ^14.0.0
  
  # État et Stockage
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  flutter_secure_storage: ^10.0.0
  get_it: ^7.2.0
  
  # Réseau et Web
  http: ^1.6.0
  webview_flutter: ^4.8.2
  connectivity_plus: ^5.0.2
  url_launcher: ^6.1.15

  # Informations sur l'appareil et le système
  device_info_plus: ^10.1.0
  battery_plus: ^5.0.0
  package_info_plus: ^8.3.0

  # Optionnel – localisation
  geolocator: ^13.0.2
  
  # Médias
  audioplayers: ^6.5.1
  video_player: ^2.10.1
  chewie: ^1.7.0

  flutter_svg: ^2.0.12
  
  # Authentification
  local_auth: ^3.0.0
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  
  # Utilitaires
  # NE METTEZ PAS intl ICI - il viendra de flutter_localizations
  path_provider: ^2.1.5
  intl: ^0.20.2
  percent_indicator: ^4.2.3

# AJOUTEZ CETTE SECTION POUR FORCER LA VERSION
#dependency_overrides:
#  intl: ^0.20.2  # Force cette version pour tous les packages

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.10.5
  json_serializable: ^6.11.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lotties/
    - assets/sounds/
    - assets/data/
    - assets/fonts/
  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Italic.ttf
          style: italic
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/OpenSans-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/OpenSans-Light.ttf
          weight: 300
        - asset: assets/fonts/OpenSans-LightItalic.ttf
          weight: 300
          style: italic